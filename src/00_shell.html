<title>Anchorgating</title>
<style>
:root{
  color-scheme: light;
  --bg:#eef0f3; --panel:#ffffff; --panel-2:#f6f7f9; --sunk:#e9ecf0;
  --ink:#12151a; --ink-2:#4a525e; --muted:#7f8793;
  --line:#e0e4ea; --line-2:#cfd5dd;
  --accent:#2a78d6; --accent-ink:#ffffff; --accent-weak:#e6f0fb; --accent-line:#b9d3f3;
  --ovr:#d9591f; --ovr-weak:#fdece3;
  --paper:#ffffff; --paper-ink:#12151a; --paper-2:#5b6470; --paper-line:#d7dbe1;
  --focus:0 0 0 3px rgba(42,120,214,.35);
  --shadow:0 8px 28px rgba(18,21,26,.16);
  --font:Arial, "Helvetica Neue", Helvetica, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0e1013; --panel:#171a1f; --panel-2:#1d2127; --sunk:#12151a;
    --ink:#eceff3; --ink-2:#b3bac4; --muted:#7c8591;
    --line:#282d35; --line-2:#353b45;
    --accent:#3987e5; --accent-ink:#ffffff; --accent-weak:#1a2a3f; --accent-line:#2d4f7a;
    --ovr:#ee7a45; --ovr-weak:#34221a;
    --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0e1013; --panel:#171a1f; --panel-2:#1d2127; --sunk:#12151a;
  --ink:#eceff3; --ink-2:#b3bac4; --muted:#7c8591;
  --line:#282d35; --line-2:#353b45;
  --accent:#3987e5; --accent-ink:#ffffff; --accent-weak:#1a2a3f; --accent-line:#2d4f7a;
  --ovr:#ee7a45; --ovr-weak:#34221a;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--font); font-size:13px; line-height:1.4}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:none; box-shadow:var(--focus)}
svg.i{width:16px; height:16px; flex:0 0 auto; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}

#app{height:100%; display:grid; gap:10px; padding:10px 16px 12px;
  grid-template-columns:280px minmax(0,1fr) 392px; grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"top top top" "side center right"}
.topbar{grid-area:top; display:flex; align-items:center; gap:14px; flex-wrap:wrap; min-height:44px}
.brand{display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; letter-spacing:-.01em; padding-right:6px}
.brand-mark{width:28px; height:28px; border-radius:8px; background:var(--ink); color:var(--bg); display:grid; place-items:center}
.brand small{font-weight:400; color:var(--muted); font-size:12px}
.reps{display:flex; align-items:center; gap:4px; background:var(--sunk); border:1px solid var(--line); padding:3px; border-radius:10px; flex-wrap:wrap}
.rep-tab{display:flex; align-items:center; gap:6px; border:0; background:transparent; padding:5px 10px; border-radius:7px; color:var(--ink-2); white-space:nowrap}
.rep-tab .cnt{font-size:11px; color:var(--muted)}
.rep-tab.on{background:var(--panel); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12); font-weight:700}
.rep-tab .x{display:none; width:16px; height:16px; border-radius:4px; align-items:center; justify-content:center; color:var(--muted)}
.rep-tab.on .x{display:inline-flex}
.rep-tab .x:hover{background:var(--sunk); color:var(--ink)}
.rep-add{border:0; background:transparent; color:var(--muted); padding:5px 8px; border-radius:7px; display:flex; align-items:center; gap:4px}
.rep-add:hover{color:var(--ink); background:var(--panel)}
.spacer{flex:1}
.tb-group{display:flex; align-items:center; gap:6px}

.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-2); background:var(--panel); padding:6px 10px; border-radius:8px; white-space:nowrap; color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk); color:var(--ink)}
.btn.sm{padding:4px 8px; font-size:12px; border-radius:7px}
.btn.icon{padding:6px}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn.on{background:var(--accent-weak); border-color:var(--accent-line); color:var(--accent)}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; min-height:0; display:flex; flex-direction:column}
.side{grid-area:side; overflow:hidden}
.center{grid-area:center; overflow:hidden}
.right{grid-area:right; overflow:hidden}
.scroll{overflow:auto; min-height:0}
.p-head{display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line)}
.p-title{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.p-sub{color:var(--muted); font-size:12px}

/* samples */
.side-split{display:flex; flex-direction:column; min-height:0; flex:1}
#sampleList{flex:1 1 50%; padding:6px 6px 10px}
.grp{margin-top:6px}
.grp-head{display:flex; align-items:center; gap:6px; padding:6px 8px 4px; color:var(--ink-2); font-weight:700; font-size:12px}
.grp-head .grp-name{cursor:text}
.grp-head .p-sub{font-weight:400}
.srow{display:grid; grid-template-columns:26px minmax(0,1fr) auto 22px 22px; align-items:center; gap:2px; padding:2px 4px 2px 2px; border-radius:8px; cursor:default; user-select:none}
.srow:hover{background:var(--panel-2)}
.srow.sel{background:var(--accent-weak)}
.srow.cur{box-shadow:inset 2px 0 0 var(--accent)}
.s-name{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:4px 4px; font-weight:700}
.s-ev{font-size:11px; color:var(--muted); padding-right:4px}
.anchor-btn{width:24px; height:24px; border-radius:6px; border:0; background:transparent; color:var(--line-2); display:grid; place-items:center}
.srow:hover .anchor-btn{color:var(--muted)}
.anchor-btn:hover{background:var(--sunk); color:var(--ink) !important}
.anchor-btn.on{color:var(--accent-ink) !important; background:var(--accent)}
.link-btn{width:22px; height:22px; border-radius:6px; border:0; background:transparent; display:grid; place-items:center; color:var(--muted); position:relative}
.link-btn:hover{background:var(--sunk)}
.link-btn.follow{color:var(--accent)}
.link-btn.ovr{color:var(--ovr)}
.link-btn .badge{position:absolute; top:-3px; right:-3px; min-width:13px; height:13px; border-radius:7px; background:var(--ovr); color:#fff; font-size:9px; line-height:13px; text-align:center; padding:0 3px; font-weight:700}
.inline-edit{width:100%; border:1px solid var(--accent); border-radius:5px; padding:3px 5px; background:var(--panel)}

/* tree */
.tree-wrap{flex:1 1 50%; border-top:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
.tree-actions{display:flex; gap:6px; padding:8px 10px; flex-wrap:wrap; border-bottom:1px solid var(--line)}
#gateTree{padding:6px 6px 12px}
.trow{display:grid; grid-template-columns:minmax(0,1fr) auto auto; align-items:center; gap:6px; padding:3px 6px; border-radius:7px; cursor:pointer}
.trow:hover{background:var(--panel-2)}
.trow.sel{background:var(--accent-weak)}
.t-name{display:flex; align-items:center; gap:6px; min-width:0}
.t-name span.nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.t-sw{width:9px; height:9px; border-radius:2px; flex:0 0 auto; border:1px solid rgba(0,0,0,.15)}
.t-pct{font-size:12px; color:var(--ink-2)}
.t-cnt{font-size:11px; color:var(--muted); min-width:52px; text-align:right}
.t-ovr{font-size:10px; color:var(--ovr); background:var(--ovr-weak); border-radius:4px; padding:1px 5px; font-weight:700; border:0}
.t-ovr:hover{text-decoration:underline}
.t-region .nm{color:var(--ink-2)}

/* center */
.c-bar{display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.seg{display:inline-flex; background:var(--sunk); border:1px solid var(--line); border-radius:9px; padding:2px}
.seg button{border:0; background:transparent; padding:4px 10px; border-radius:7px; color:var(--ink-2); white-space:nowrap; display:inline-flex; align-items:center; gap:5px}
.seg button.on{background:var(--panel); color:var(--ink); font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.12)}
.divider{width:1px; height:22px; background:var(--line)}
.tool{border:1px solid transparent; background:transparent; border-radius:8px; padding:5px 8px; display:inline-flex; align-items:center; gap:5px; color:var(--ink-2)}
.tool:hover{background:var(--sunk); color:var(--ink)}
.tool.on{background:var(--accent); color:var(--accent-ink)}
.c-context{display:flex; align-items:center; gap:8px; padding:7px 12px; font-size:12px; color:var(--ink-2); border-bottom:1px solid var(--line); background:var(--panel-2); flex-wrap:wrap; min-height:34px}
.chip{display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:20px; border:1px solid var(--line-2); background:var(--panel); font-size:12px; white-space:nowrap}
.chip.anchor{border-color:var(--accent-line); color:var(--accent); background:var(--accent-weak)}
.chip.ovr{border-color:transparent; color:var(--ovr); background:var(--ovr-weak)}
.hint{color:var(--muted)}
.plots{display:grid; grid-template-columns:repeat(auto-fill, minmax(290px, 1fr)); gap:12px; padding:12px; align-content:start}
.grid{display:grid; gap:10px; padding:12px; align-content:start}
.empty{padding:40px 24px; text-align:center; color:var(--ink-2); display:flex; flex-direction:column; gap:10px; align-items:center}
.empty b{color:var(--ink); font-size:15px}

.pcard{background:var(--paper); color:var(--paper-ink); border:1px solid var(--line); border-radius:10px; display:flex; flex-direction:column; min-width:0}
.pcard.anchor{border-color:var(--accent-line)}
.pc-head{display:flex; align-items:center; gap:6px; padding:7px 8px 4px 10px; min-height:34px}
.pc-title{font-weight:700; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0}
.pc-title .p-sub{color:var(--paper-2); font-weight:400}
.axbtn{border:1px solid var(--paper-line); background:#fff; color:var(--paper-ink); border-radius:6px; padding:2px 6px; font-size:11px; display:inline-flex; align-items:center; gap:3px; max-width:118px}
.axbtn span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.axbtn:hover{border-color:var(--paper-2)}
.axbtn b{color:var(--paper-2); font-weight:400}
.pc-menu{border:0; background:transparent; color:var(--paper-2); border-radius:6px; padding:3px}
.pc-menu:hover{background:#eef0f3; color:var(--paper-ink)}
.cv{position:relative; width:100%; aspect-ratio:1/1; max-width:100%; touch-action:none}
.cv canvas{position:absolute; inset:0; width:100%; height:100%}
.pc-foot{display:flex; flex-wrap:wrap; gap:5px; padding:4px 8px 8px; font-size:11px; color:var(--paper-2); min-height:28px; align-items:center}
.gchip{display:inline-flex; align-items:center; gap:4px; padding:1px 6px; border-radius:5px; background:#f1f3f6; color:var(--paper-ink); border:0; font-size:11px}
.gchip.sel{background:#e3eefb; color:#1c5cab}
.gchip .ov{color:#c24f1b; font-weight:700}

.tile .pc-head{padding:5px 6px 2px 4px; min-height:30px}
.tile .pc-foot{padding:3px 6px 6px; gap:3px}
.tile .anchor-btn{color:#c7ccd4}
.tile .anchor-btn:hover{background:#eef0f3; color:#12151a !important}
.tile .link-btn{color:#8a929d}
.rg{display:grid; grid-template-columns:1fr 1fr; gap:2px 8px; width:100%}
.rg div{display:flex; justify-content:space-between; gap:4px; white-space:nowrap; overflow:hidden}
.rg i{font-style:normal; overflow:hidden; text-overflow:ellipsis}

/* right */
.r-tabs{display:flex; gap:2px; padding:6px; border-bottom:1px solid var(--line)}
.r-tabs button{flex:1; border:0; background:transparent; padding:7px 6px; border-radius:8px; color:var(--ink-2)}
.r-tabs button.on{background:var(--accent-weak); color:var(--accent); font-weight:700}
.r-body{padding:12px; display:flex; flex-direction:column; gap:14px}
.field{display:flex; flex-direction:column; gap:6px}
.f-label{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:6px}
.f-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.sel-input{border:1px solid var(--line-2); background:var(--panel); border-radius:7px; padding:5px 8px; min-width:0}
.txt-input{border:1px solid var(--line-2); background:var(--panel); border-radius:7px; padding:5px 8px; min-width:0; width:100%}
.check{display:inline-flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap}
.check input{accent-color:var(--accent)}
.pill-list{display:flex; flex-wrap:wrap; gap:5px}
.pill{border:1px solid var(--line-2); background:var(--panel); border-radius:20px; padding:3px 9px; font-size:12px; display:inline-flex; align-items:center; gap:5px}
.pill.on{background:var(--accent-weak); border-color:var(--accent-line); color:var(--accent); font-weight:700}
.pill .sw{width:10px; height:10px; border-radius:3px}
.chart-box{background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:6px; color:var(--paper-ink); position:relative}
.chart-box svg{display:block; width:100%; height:auto}
.note{font-size:12px; color:var(--muted)}
table.st{width:100%; border-collapse:collapse; font-size:12px}
table.st th{text-align:left; font-weight:700; color:var(--muted); font-size:11px; padding:5px 6px; border-bottom:1px solid var(--line); white-space:nowrap}
table.st td{padding:4px 6px; border-bottom:1px solid var(--line); white-space:nowrap}
table.st td.r, table.st th.r{text-align:right}
.tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:8px}
.pal{display:grid; grid-template-columns:1fr; gap:6px}
.pal button{display:grid; grid-template-columns:92px 1fr auto; align-items:center; gap:8px; border:1px solid var(--line-2); background:var(--panel); border-radius:8px; padding:5px 8px; text-align:left}
.pal button.on{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.pal .ramp{height:12px; border-radius:3px}
.tag{font-size:10px; padding:1px 6px; border-radius:10px; background:var(--accent-weak); color:var(--accent); font-weight:700}
.tag.warn{background:var(--sunk); color:var(--muted)}
input[type=range]{accent-color:var(--accent); width:100%}
input[type=color]{width:30px; height:26px; border:1px solid var(--line-2); border-radius:6px; padding:1px; background:var(--panel)}
.qnames{display:grid; grid-template-columns:auto 1fr; gap:6px 8px; align-items:center}
.qpos{font-size:11px; color:var(--muted); white-space:nowrap}
.qgrid{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.qcell{border:1px solid var(--line); border-radius:8px; padding:6px; display:flex; flex-direction:column; gap:4px; background:var(--panel-2)}


.srow{cursor:grab}
.srow.dragging{opacity:.45}
.srow.drop-before{box-shadow:inset 0 2px 0 var(--accent)}
.srow.drop-after{box-shadow:inset 0 -2px 0 var(--accent)}
.grp-head.drop-into{background:var(--accent-weak); border-radius:6px}
.canvas-edit{position:fixed; z-index:80; border:2px solid var(--accent); border-radius:6px; padding:4px 7px; background:#ffffff; color:#12151a; font:13px Arial, sans-serif; box-shadow:var(--shadow)}
svg [data-rename]{cursor:text}
.exp-grid{display:grid; grid-template-columns:minmax(260px, 320px) minmax(0,1fr); gap:18px; align-items:start}
.exp-preview{background:repeating-conic-gradient(var(--panel-2) 0% 25%, var(--panel) 0% 50%) 0 0/16px 16px; border:1px solid var(--line); border-radius:10px; padding:18px; overflow:auto; max-height:min(620px, calc(100vh - 220px)); display:flex; align-items:flex-start; justify-content:center}
.exp-preview canvas, .exp-preview svg{box-shadow:0 1px 6px rgba(0,0,0,.18); background:#fff; flex:0 0 auto}
.modal{width:min(1120px, 100%)}
.pal-group{font-size:11px; color:var(--muted); margin:6px 0 0}
.swatches{display:flex; gap:6px; flex-wrap:wrap}
.swatch{width:22px; height:22px; border-radius:6px; border:1px solid var(--line-2); padding:0}
.swatch.on{box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--accent)}
.stop{position:relative; display:inline-flex}
.stop-x{position:absolute; top:-6px; right:-6px; width:15px; height:15px; border-radius:8px; border:0; background:var(--ink-2); color:var(--panel); font-size:10px; line-height:15px; padding:0}
@media (max-width:760px){ .exp-grid{grid-template-columns:minmax(0,1fr)} }
.proto{border-bottom:1px solid var(--line); background:var(--panel-2); border-radius:12px 12px 0 0}
.proto-steps{margin:0; padding-left:18px; color:var(--ink-2); font-size:12px; line-height:1.5}
.proto-steps li::marker{color:var(--muted)}
/* overlays */
#toast{position:fixed; left:50%; bottom:max(18px, env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 14px; border-radius:10px; box-shadow:var(--shadow); display:flex; gap:12px; align-items:center; z-index:60; max-width:min(560px, calc(100vw - 32px)); font-size:13px}
#toast button{background:transparent; border:1px solid rgba(255,255,255,.35); color:inherit; border-radius:6px; padding:3px 8px}
.pop{position:fixed; z-index:50; background:var(--panel); border:1px solid var(--line-2); border-radius:12px; box-shadow:var(--shadow); padding:12px; width:290px; max-width:calc(100vw - 32px); max-height:min(560px, calc(100vh - 32px)); overflow:auto; display:flex; flex-direction:column; gap:12px}
.menu{position:fixed; z-index:55; background:var(--panel); border:1px solid var(--line-2); border-radius:10px; box-shadow:var(--shadow); padding:5px; min-width:200px}
.menu button{display:flex; width:100%; align-items:center; gap:8px; border:0; background:transparent; text-align:left; padding:7px 9px; border-radius:7px}
.menu button:hover{background:var(--sunk)}
.menu .sep{height:1px; background:var(--line); margin:4px 2px}
.menu .mh{font-size:11px; color:var(--muted); padding:5px 9px 3px; font-weight:700}
.param-list{display:flex; flex-direction:column; gap:2px; max-height:190px; overflow:auto; border:1px solid var(--line); border-radius:8px; padding:3px}
.param-list button{border:0; background:transparent; text-align:left; padding:5px 8px; border-radius:6px; display:flex; justify-content:space-between; gap:8px}
.param-list button:hover{background:var(--sunk)}
.param-list button.on{background:var(--accent-weak); color:var(--accent); font-weight:700}
.param-list small{color:var(--muted); font-weight:400}
#drop{position:fixed; inset:0; z-index:70; background:rgba(42,120,214,.12); border:3px dashed var(--accent); display:grid; place-items:center; font-size:18px; font-weight:700; color:var(--accent)}
.modal-back{position:fixed; inset:0; background:rgba(10,12,15,.45); z-index:45; display:grid; place-items:center; padding:16px}
.modal{background:var(--panel); border-radius:14px; box-shadow:var(--shadow); width:min(980px, 100%); max-height:calc(100vh - 32px); overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px}
.demo-banner{display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:8px; background:var(--accent-weak); color:var(--accent); font-size:12px; border:1px solid var(--accent-line)}
.tip{position:fixed; z-index:65; pointer-events:none; background:var(--ink); color:var(--bg); padding:7px 9px; border-radius:8px; font-size:12px; box-shadow:var(--shadow); max-width:260px}
.kbd{font-size:11px; border:1px solid var(--line-2); border-bottom-width:2px; border-radius:4px; padding:0 4px; background:var(--panel-2); color:var(--ink-2)}

@media (max-width:1200px){
  #app{height:auto; min-height:100%; grid-template-columns:260px minmax(0,1fr); grid-template-rows:auto auto auto;
    grid-template-areas:"top top" "side center" "side right"}
  .center{min-height:640px}
  .side{max-height:none}
}
@media (max-width:760px){
  #app{grid-template-columns:minmax(0,1fr); grid-template-areas:"top" "side" "center" "right"}
  .side{max-height:520px}
  .plots{grid-template-columns:minmax(0,1fr)}
  .center{min-height:0}
}
@media (prefers-reduced-motion: no-preference){
  .handle-pulse{animation:none}
}
</style>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M12 7v14M5 12H3a9 9 0 0 0 18 0h-2M8 10h8"/></svg></div>
      <div>Anchorgating <small>FACS gating · 브라우저에서만 처리</small></div>

      <div class="scroll" id="sampleList"></div>

        <button class="tool" data-tool="poly" title="다각형 gate: 클릭으로 꼭짓점, 첫 점 클릭 또는 더블클릭으로 닫기"><svg class="i" viewBox="0 0 24 24"><path d="M5 17 7 6l9-2 4 9-8 7z"/></svg>다각형</button>
